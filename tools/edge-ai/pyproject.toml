[project]
name = "edge-ai"
version = "0.1.0"
description = "Distill marvin's gameplay commands into a small causal model over the fretboard ADC stream."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
edge-ai = "edge_ai.cli:main"

[dependency-groups]
# Training/eval need numpy + torch. The data loader's window-index logic, the
# lag-measurement utility, and the metrics are stdlib-only so they run (and
# test) without these heavy deps installed.
train = [
    "numpy>=1.26",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
]
# Model visualisation: torchinfo (summary table + mult-adds), torchview (graph;
# also needs the graphviz binary — `brew install graphviz`), matplotlib (RF-cone
# plot). torchinfo/torchview need torch, so install alongside the train group:
#   uv sync --group train --group viz
viz = [
    "torchinfo>=1.8",
    "torchview>=0.2.6",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_ai"]

[project]
name = "marvin-perf"
version = "0.1.0"
description = "Host-side decoder and analyzer for marvin firmware perf-log streams."
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
marvin-perf = "marvin_perf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marvin_perf"]

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fret Tuner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       background: #1a1a2e; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }

#sidebar { width: 280px; min-width: 280px; background: #16213e; padding: 16px;
           overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
           border-right: 1px solid #0f3460; }
#charts  { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
#video-panel { width: 360px; min-width: 360px; background: #16213e; padding: 12px;
               display: flex; flex-direction: column; gap: 8px;
               border-left: 1px solid #0f3460; overflow-y: auto; }
#video-container { position: relative; width: 100%; background: #000; border-radius: 4px; overflow: hidden; min-height: 120px; }
#mjpeg-video { width: 100%; display: block; border-radius: 4px; }
#cam-status { font-size: 11px; color: #666; text-align: center; }
#cam-time { font-size: 11px; color: #e94560; font-family: monospace; text-align: center; }

h1 { font-size: 16px; color: #e94560; margin-bottom: 4px; }
h2 { font-size: 13px; color: #999; text-transform: uppercase; letter-spacing: 1px;
     margin-bottom: 8px; border-bottom: 1px solid #0f3460; padding-bottom: 4px; }

.section { display: flex; flex-direction: column; gap: 6px; }

label { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; align-items: center; }
label span.val { color: #e94560; font-weight: 600; font-family: monospace; }

select, input[type=range], button, input[type=number] {
  width: 100%; font-size: 13px; background: #1a1a2e; color: #e0e0e0;
  border: 1px solid #0f3460; border-radius: 4px; padding: 4px 8px; }
select:focus, button:focus, input[type=number]:focus { outline: 1px solid #e94560; }

input[type=range] { padding: 0; cursor: pointer; accent-color: #e94560; }
input[type=number] { width: 70px; text-align: right; font-family: monospace;
  -moz-appearance: textfield; }
input[type=number]::-webkit-inner-spin-button { opacity: 1; }

.slider-row { display: flex; align-items: center; gap: 6px; }
.slider-row input[type=range] { flex: 1; }
.slider-row input[type=number] { flex: 0 0 70px; }

button { cursor: pointer; padding: 8px; font-weight: 600; transition: background 0.15s; }
button:hover { background: #0f3460; }

button.active { background: #e94560; color: #fff; border-color: #e94560; }

#status, .port-status { font-size: 11px; padding: 6px 8px; border-radius: 4px; text-align: center; }
#status.connected, .port-status.connected { background: #0a3d2a; color: #4ade80; }
#status.disconnected, .port-status.disconnected { background: #3d0a0a; color: #f87171; }
#status.serial-lost, .port-status.serial-lost { background: #3d2a0a; color: #fbbf24; }

.chart-wrap { flex: 1; min-height: 120px; }
.chart-wrap .uplot { width: 100% !important; }

#timeline { height: 50px; flex: 0 0 50px; background: #111122; border-radius: 4px;
            cursor: crosshair; display: none; margin-top: 4px; }
#timeline.visible { display: block; }
#timeline canvas { display: block; }

#window-control { display: flex; align-items: center; gap: 8px; }
#window-control input { flex: 1; }

.manual-row { display: flex; gap: 6px; }
.manual-btn { flex: 1; padding: 10px 0; font-weight: 700; font-size: 14px; text-align: center;
  background: #1a1a2e; color: var(--btn-color, #e0e0e0); border: 2px solid var(--btn-color, #0f3460);
  border-radius: 6px; cursor: pointer; user-select: none; touch-action: none;
  transition: background 0.1s, opacity 0.15s; }
.manual-btn:active, .manual-btn.held { background: var(--btn-color, #0f3460); color: #fff; }
.manual-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.manual-btn:disabled:active { background: #1a1a2e; color: var(--btn-color, #e0e0e0); }
.manual-btn:disabled.held { opacity: 1; background: var(--btn-color, #0f3460); color: #fff; }
.strum-btn { --btn-color: #a855f7; }

#scrub-controls { display: flex; flex-direction: column; gap: 6px; margin-top: 4px;
  padding-top: 6px; border-top: 1px solid #0f3460; }
#scrub-controls[hidden] { display: none; }
.scrub-row { display: flex; gap: 4px; }
.scrub-row button { padding: 6px 0; font-size: 14px; font-weight: 700;
  font-family: monospace; }
#btn-slowmo.active { background: #e94560; color: #fff; border-color: #e94560; }
#scrub-info { font-size: 11px; font-family: monospace; color: #888;
  text-align: center; }
</style>
</head>
<body>

<div id="sidebar">
  <div>
    <h1>Fret Tuner</h1>
    <div id="status" class="disconnected">Disconnected</div>
  </div>

  <div class="section">
    <h2>Detector</h2>
    <select id="detector-select"></select>
    <div id="param-sliders"></div>
  </div>


</div>

<div id="charts">
  <div id="timeline"><canvas id="timeline-canvas"></canvas></div>
</div>

<div id="video-panel">
  <div class="section">
    <h2>Camera</h2>
    <select id="camera-select"><option value="">No camera</option></select>
  </div>
  <div id="video-container">
    <img id="mjpeg-video" src="" alt="video reference"/>
  </div>
  <div id="cam-time"></div>
  <div style="display:flex;gap:6px;align-items:center;">
    <div id="cam-status" style="flex:1">No camera selected</div>
    <button id="btn-mute" style="width:auto;padding:4px 10px;font-size:12px;">Unmute</button>
  </div>

  <div class="section">
    <h2>Actuator</h2>
    <select id="actuator-port-select"><option value="none">None</option></select>
    <div id="actuator-status" class="port-status disconnected">Not attached</div>
    <button id="btn-actuate">Enable Actuation</button>
    <div id="timing-sliders"></div>
  </div>

  <div class="section">
    <h2>Transport</h2>
    <button id="btn-pause">Pause</button>
    <div id="window-control">
      <label>Window <span class="val" id="window-val">2.0s</span></label>
      <input type="range" id="window-range" min="0.5" max="30" step="0.5" value="2.0">
    </div>

    <div id="scrub-controls" hidden>
      <div class="scrub-row">
        <button id="btn-step-back-10" title="-10 frames (Shift+Left)">&laquo;</button>
        <button id="btn-step-back-1" title="-1 frame (Left)">&lsaquo;</button>
        <button id="btn-slowmo" title="Slow-motion play / pause (Space)">&#9658;</button>
        <button id="btn-step-fwd-1" title="+1 frame (Right)">&rsaquo;</button>
        <button id="btn-step-fwd-10" title="+10 frames (Shift+Right)">&raquo;</button>
      </div>
      <label>Speed
        <select id="slowmo-speed">
          <option value="0.1">0.1x</option>
          <option value="0.25" selected>0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="1">1x</option>
        </select>
      </label>
      <div id="scrub-info">--</div>
    </div>
  </div>

  <div class="section">
    <h2>Manual</h2>
    <div id="manual-buttons">
      <div class="manual-row">
        <button class="manual-btn" data-bit="0" style="--btn-color:#22c55e">G</button>
        <button class="manual-btn" data-bit="1" style="--btn-color:#ef4444">R</button>
        <button class="manual-btn" data-bit="2" style="--btn-color:#eab308">Y</button>
        <button class="manual-btn" data-bit="3" style="--btn-color:#3b82f6">B</button>
        <button class="manual-btn" data-bit="4" style="--btn-color:#f97316">O</button>
      </div>
      <div class="manual-row">
        <button class="manual-btn strum-btn" data-bit="5">Strum &#9650;</button>
        <button class="manual-btn strum-btn" data-bit="6">Strum &#9660;</button>
      </div>
    </div>
  </div>
</div>

<script>
const MAX_POINTS = 15000; // 30 seconds at 500 Hz

const STORAGE_KEY = "fret-tuner-settings";
let ws = null;
let paused = false;
let windowSec = 2.0;
let strumDelayMs = 220;
// Camera-as-master-clock. The currently-displayed video frame is the
// ground truth for "now"; every other UI element (chart cursor, timeline
// position, overlay text) reads from `currentFrame.t`. `seq` is the
// authoritative frame identifier when known (from server snap/step
// responses or frame_tick); we fall back to `t` for snap-to-closest when
// seq is null (initial scrub, or no camera attached).
let currentFrame = { seq: null, t: 0 };
let lastFrameTickAt = 0; // performance.now() of the most recent frame_tick

function hasCamera() {
  return activeSourceId != null && activeSourceId !== "none";
}

function setCurrentFrame(seq, t) {
  if (typeof t === "number" && isFinite(t)) currentFrame.t = t;
  currentFrame.seq = (seq == null ? null : Number(seq));
}

let _renderingFromTimeline = false;

function loadSettings() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveSettings(patch) {
  const s = loadSettings();
  Object.assign(s, patch);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}
function savedParam(key, fallback) {
  const s = loadSettings();
  if (s.params && s.params[key] !== undefined) return s.params[key];
  if (s.timing && s.timing[key] !== undefined) return s.timing[key];
  return fallback;
}

// Detector-driven chart schema. Populated from the server's `detector`
// message; until then charts stay empty. Each entry is:
//   { id, label, color, y_range: [min, max],
//     series: [ { key, label, color, width, dash? }, ... ] }
let currentSchema = [];

// Per-slot ring buffers built dynamically from the schema:
//   data[slot.id] = { t, series: { <key>: [] }, pressed, pressCount }
const data = {};

// uPlot instances, keyed by slot.id
const plots = {};

function slotById(id) {
  return currentSchema.find(s => s.id === id);
}

function firstSlotId() {
  return currentSchema.length ? currentSchema[0].id : null;
}

function makePressBands(slotId, slotColor) {
  return {
    hooks: {
      draw: [
        (u) => {
          const ctx = u.ctx;
          const d = data[slotId];
          if (!d || !d.t.length) return;

          ctx.save();
          ctx.fillStyle = slotColor;
          ctx.globalAlpha = 0.15;

          let inPress = false;
          let x0 = 0;
          for (let i = 0; i < d.t.length; i++) {
            const px = u.valToPos(d.t[i], "x", true);
            if (px < u.bbox.left || px > u.bbox.left + u.bbox.width) {
              if (d.pressed[i]) { inPress = true; x0 = px; }
              else { inPress = false; }
              continue;
            }
            if (d.pressed[i] && !inPress) {
              inPress = true;
              x0 = px;
            } else if (!d.pressed[i] && inPress) {
              inPress = false;
              ctx.fillRect(x0, u.bbox.top, px - x0, u.bbox.height);
            }
          }
          if (inPress) {
            const px = u.valToPos(d.t[d.t.length - 1], "x", true);
            ctx.fillRect(x0, u.bbox.top, px - x0, u.bbox.height);
          }

          // Strike line: strum delay behind "now". "Now" is the timestamp
          // of the currently displayed video frame (camera as master); if
          // there's no camera we fall back to the latest ADC sample.
          if (d.t.length > 1) {
            const tLatest = hasCamera() ? currentFrame.t : d.t[d.t.length - 1];
            const strikeT = tLatest - strumDelayMs / 1000;
            const sx = u.valToPos(strikeT, "x", true);
            if (sx >= u.bbox.left && sx <= u.bbox.left + u.bbox.width) {
              ctx.strokeStyle = "#e94560";
              ctx.globalAlpha = 0.7;
              ctx.lineWidth = 1.5;
              ctx.setLineDash([6, 4]);
              ctx.beginPath();
              ctx.moveTo(sx, u.bbox.top);
              ctx.lineTo(sx, u.bbox.top + u.bbox.height);
              ctx.stroke();
              ctx.setLineDash([]);
            }
          }

          if (paused) {
            const scrubX = u.valToPos(currentFrame.t, "x", true);
            if (scrubX >= u.bbox.left && scrubX <= u.bbox.left + u.bbox.width) {
              ctx.strokeStyle = "#fff";
              ctx.globalAlpha = 0.8;
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(scrubX, u.bbox.top);
              ctx.lineTo(scrubX, u.bbox.top + u.bbox.height);
              ctx.stroke();
            }
          }

          ctx.strokeStyle = slotColor;
          ctx.globalAlpha = 0.6;
          ctx.lineWidth = 2;
          for (let i = 1; i < d.t.length; i++) {
            if (d.pressed[i] && d.pressed[i - 1]
                && d.pressCount[i] !== d.pressCount[i - 1]) {
              const px = u.valToPos(d.t[i], "x", true);
              if (px >= u.bbox.left && px <= u.bbox.left + u.bbox.width) {
                ctx.beginPath();
                ctx.moveTo(px, u.bbox.top);
                ctx.lineTo(px, u.bbox.top + u.bbox.height);
                ctx.stroke();
              }
            }
          }

          ctx.restore();
        }
      ]
    }
  };
}

function createChart(slot, el) {
  const rect = el.getBoundingClientRect();

  const series = [{}];
  for (const s of slot.series) {
    const spec = { label: s.label, stroke: s.color, width: s.width || 1 };
    if (s.dash) spec.dash = s.dash;
    series.push(spec);
  }

  const opts = {
    width: rect.width,
    height: rect.height,
    plugins: [makePressBands(slot.id, slot.color)],
    cursor: { drag: { x: true, y: true, uni: 50 } },
    scales: {
      x: { time: false },
      y: { range: slot.y_range && slot.y_range.length === 2
            ? slot.y_range : [0, 4096] },
    },
    axes: [
      { size: 30, font: "10px monospace", stroke: "#666", grid: { stroke: "#222", width: 1 } },
      { size: 45, font: "10px monospace", stroke: "#666", grid: { stroke: "#222", width: 1 },
        label: slot.label, labelFont: "bold 11px sans-serif", labelGap: 4 },
    ],
    series,
  };

  opts.hooks = opts.hooks || {};
  opts.hooks.setScale = [(u, key) => {
    if (key === "x" && paused && !_renderingFromTimeline) {
      // Chart pan while paused: resolve the new center time to the
      // closest buffered frame and pin currentFrame there. scrubToTime
      // updates the video, currentFrame, chart center, and timeline.
      const t = getChartCenterTime();
      scrubToTime(t);
    }
  }];

  const empty = [[]];
  for (let i = 0; i < slot.series.length; i++) empty.push([]);
  const plot = new uPlot(opts, empty, el);
  plots[slot.id] = plot;
}

function applySchema(schema) {
  if (!Array.isArray(schema) || !schema.length) return;
  currentSchema = schema;

  for (const id of Object.keys(plots)) {
    try { plots[id].destroy(); } catch (e) { /* ignore */ }
    delete plots[id];
    delete data[id];
  }

  const container = document.getElementById("charts");
  container.querySelectorAll(".chart-wrap").forEach(el => el.remove());

  // Two passes: insert ALL chart-wrap divs first so the flex container
  // distributes height across them, THEN measure and construct uPlot
  // instances. Otherwise the first chart we create takes the full available
  // height and its canvas overlaps later ones once siblings are added.
  const timeline = document.getElementById("timeline");
  const wraps = [];
  for (const slot of schema) {
    data[slot.id] = {
      t: [],
      series: {},
      pressed: [],
      pressCount: [],
    };
    for (const s of slot.series) data[slot.id].series[s.key] = [];

    const el = document.createElement("div");
    el.className = "chart-wrap";
    el.id = "chart-slot-" + slot.id;
    container.insertBefore(el, timeline);
    wraps.push({ slot, el });
  }
  for (const { slot, el } of wraps) {
    createChart(slot, el);
  }
}

function initCharts() {
  window.addEventListener("resize", () => {
    for (const slot of currentSchema) {
      const el = document.getElementById("chart-slot-" + slot.id);
      const plot = plots[slot.id];
      if (!el || !plot) continue;
      const r = el.getBoundingClientRect();
      plot.setSize({ width: r.width, height: r.height });
    }
  });
}

function updateCharts() {
  // Live mode: when the camera is the master clock, only render samples
  // up through `currentFrame.t` so the chart's leading edge tracks the
  // displayed video frame. Without a camera we fall back to the latest
  // ingested ADC sample.
  const cam = hasCamera();
  for (const slot of currentSchema) {
    const d = data[slot.id];
    if (!d || !d.t.length) continue;
    const plot = plots[slot.id];
    if (!plot) continue;

    const tMax = cam ? currentFrame.t : d.t[d.t.length - 1];
    const tMin = tMax - windowSec;

    // Find first index >= tMin and last index <= tMax.
    let startIdx = 0;
    for (let i = 0; i < d.t.length; i++) {
      if (d.t[i] >= tMin) { startIdx = i; break; }
    }
    let endIdx = d.t.length;
    if (cam) {
      // Binary search for the rightmost i with d.t[i] <= tMax.
      let lo = startIdx, hi = d.t.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (d.t[mid] <= tMax) lo = mid + 1; else hi = mid;
      }
      endIdx = lo;
    }

    const cols = [d.t.slice(startIdx, endIdx)];
    for (const s of slot.series) {
      const arr = d.series[s.key];
      cols.push(arr ? arr.slice(startIdx, endIdx) : []);
    }
    plot.setData(cols);
  }
}

function trimBuffers() {
  for (const slot of currentSchema) {
    const d = data[slot.id];
    if (!d || d.t.length <= MAX_POINTS) continue;
    const excess = d.t.length - MAX_POINTS;
    d.t.splice(0, excess);
    d.pressed.splice(0, excess);
    d.pressCount.splice(0, excess);
    for (const key of Object.keys(d.series)) d.series[key].splice(0, excess);
  }
}

// --- Timeline scrubber ---

function clampScrubTime() {
  // Clamp ONLY to the actual buffer span. Do NOT inset by windowSec/2 --
  // we are scrubbing per-frame, and the rendered window is allowed to be
  // truncated near the edges. Pre-camera-as-master code inset the range
  // to keep the chart window centered, but that silently warped the
  // scrubbed frame backwards by up to windowSec/2 every time the user
  // stepped near a buffer edge, producing the "single frame mostly,
  // sometimes a second" jump pattern.
  const id = firstSlotId();
  const d = id ? data[id] : null;
  if (!d || !d.t.length) return;
  const bufStart = d.t[0];
  const bufEnd = d.t[d.t.length - 1];
  const t = currentFrame.t;
  const clamped = Math.max(bufStart, Math.min(bufEnd, t));
  if (clamped !== t) {
    // The clamped t no longer corresponds to the seq we held -- the next
    // snap/step will refresh it.
    setCurrentFrame(null, clamped);
  }
}

// Pure: redraw all charts and the mini-timeline centered at `centerT`.
// Does NOT touch the video viewport -- callers are responsible for
// pairing this with the appropriate showFrameBy* call. Splitting these
// concerns is what lets stepping/scrubbing be 100% seq-driven for the
// video while charts/timeline ride along on the seq's t.
function renderAtTime(centerT, halfWin) {
  _renderingFromTimeline = true;
  for (const slot of currentSchema) {
    const d = data[slot.id];
    if (!d || !d.t.length) continue;
    const plot = plots[slot.id];
    if (!plot) continue;

    const tMin = centerT - halfWin;
    const tMax = centerT + halfWin;

    let lo = 0, hi = d.t.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (d.t[mid] < tMin) lo = mid + 1; else hi = mid; }
    const startIdx = Math.max(0, lo - 1);

    lo = startIdx; hi = d.t.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (d.t[mid] <= tMax) lo = mid + 1; else hi = mid; }
    const endIdx = Math.min(d.t.length, lo + 1);

    const cols = [d.t.slice(startIdx, endIdx)];
    for (const s of slot.series) {
      const arr = d.series[s.key];
      cols.push(arr ? arr.slice(startIdx, endIdx) : []);
    }
    plot.setData(cols);
  }
  _renderingFromTimeline = false;
  drawTimeline();
}

function drawTimeline() {
  const canvas = document.getElementById("timeline-canvas");
  if (!canvas) return;
  const container = document.getElementById("timeline");
  if (container) {
    const cr = container.getBoundingClientRect();
    if (cr.width > 0 && cr.height > 0 && (canvas.width !== Math.round(cr.width) || canvas.height !== Math.round(cr.height))) {
      canvas.width = Math.round(cr.width);
      canvas.height = Math.round(cr.height);
    }
  }
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  if (!W || !H) return;

  ctx.clearRect(0, 0, W, H);

  const refId = firstSlotId();
  const ref = refId ? data[refId] : null;
  if (!ref || !ref.t.length) return;
  const bufStart = ref.t[0];
  const bufEnd = ref.t[ref.t.length - 1];
  const bufDur = bufEnd - bufStart;
  if (bufDur <= 0) return;

  // Mini overview: per-slot first series, scaled to its own y_range.
  for (const slot of currentSchema) {
    const cd = data[slot.id];
    if (!cd || !cd.t.length || !slot.series.length) continue;
    const key = slot.series[0].key;
    const arr = cd.series[key];
    if (!arr || !arr.length) continue;
    const yMin = (slot.y_range && slot.y_range.length === 2) ? slot.y_range[0] : 0;
    const yMax = (slot.y_range && slot.y_range.length === 2) ? slot.y_range[1] : 4096;
    const ySpan = (yMax - yMin) || 1;

    ctx.strokeStyle = slot.color || "#888";
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    const step = Math.max(1, Math.floor(cd.t.length / W));
    for (let i = 0; i < cd.t.length; i += step) {
      const x = ((cd.t[i] - bufStart) / bufDur) * W;
      const y = H - ((arr[i] - yMin) / ySpan) * H;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  const tNow = currentFrame.t;
  const vpLeft = Math.max(0, ((tNow - windowSec / 2 - bufStart) / bufDur) * W);
  const vpRight = Math.min(W, ((tNow + windowSec / 2 - bufStart) / bufDur) * W);
  ctx.fillStyle = "rgba(233, 69, 96, 0.15)";
  ctx.fillRect(vpLeft, 0, vpRight - vpLeft, H);
  ctx.strokeStyle = "#e94560";
  ctx.lineWidth = 1;
  ctx.strokeRect(vpLeft + 0.5, 0.5, vpRight - vpLeft - 1, H - 1);

  const sx = ((tNow - bufStart) / bufDur) * W;
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(sx, 0);
  ctx.lineTo(sx, H);
  ctx.stroke();

  ctx.fillStyle = "#888";
  ctx.font = "10px monospace";
  ctx.textAlign = "left";
  ctx.fillText(bufStart.toFixed(1) + "s", 4, H - 4);
  ctx.textAlign = "right";
  ctx.fillText(bufEnd.toFixed(1) + "s", W - 4, H - 4);
  ctx.textAlign = "center";
  ctx.fillStyle = "#e94560";
  ctx.fillText(tNow.toFixed(2) + "s", sx, 12);
}

function zoomAtScrub(factor) {
  windowSec = Math.max(0.05, Math.min(30, windowSec * factor));
  const slider = document.getElementById("window-range");
  slider.value = Math.min(parseFloat(slider.max), Math.max(parseFloat(slider.min), windowSec));
  document.getElementById("window-val").textContent = windowSec.toFixed(1) + "s";
  clampScrubTime();
  renderAtTime(currentFrame.t, windowSec / 2);
}

function initTimeline() {
  const canvas = document.getElementById("timeline-canvas");
  const container = document.getElementById("timeline");
  if (!canvas || !container) return;

  function resizeCanvas() {
    const rect = container.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    if (paused) drawTimeline();
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  let dragging = false;

  function timeFromX(clientX) {
    const rect = canvas.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    const id = firstSlotId();
    const d = id ? data[id] : null;
    if (!d || !d.t.length) return 0;
    return d.t[0] + ratio * (d.t[d.t.length - 1] - d.t[0]);
  }

  canvas.addEventListener("mousedown", (e) => {
    if (!paused) return;
    dragging = true;
    // Drag resolves to the closest buffered frame on the server side.
    // scrubToTime fetches the snap, writes the authoritative {seq, t}
    // into currentFrame, and re-renders the chart.
    scrubToTime(timeFromX(e.clientX));
  });

  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    scrubToTime(timeFromX(e.clientX));
  });

  window.addEventListener("mouseup", () => { dragging = false; });

  canvas.addEventListener("wheel", (e) => {
    if (!paused) return;
    e.preventDefault();
    zoomAtScrub(e.deltaY > 0 ? 1.3 : 1 / 1.3);
  }, { passive: false });
}

// WebSocket
function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(proto + "//" + location.host + "/ws");

  ws.onopen = () => {
    document.getElementById("status").className = "connected";
    document.getElementById("status").textContent = "Connected";
    const saved = loadSettings();
    if (saved.detector) {
      ws.send(JSON.stringify({ type: "set_detector", name: saved.detector }));
    }
    if (saved.params && Object.keys(saved.params).length) {
      ws.send(JSON.stringify({ type: "set_params", params: saved.params }));
    }
    if (saved.timing && Object.keys(saved.timing).length) {
      ws.send(JSON.stringify({ type: "set_timing", params: saved.timing }));
    }
  };

  ws.onclose = () => {
    document.getElementById("status").className = "disconnected";
    document.getElementById("status").textContent = "Disconnected";
    setTimeout(connect, 1000);
  };

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);

    if (msg.type === "data") {
      for (let i = 0; i < msg.samples.length; i++) {
        const s = msg.samples[i];
        const st = msg.state[i];
        for (const slot of currentSchema) {
          const d = data[slot.id];
          if (!d) continue;
          d.t.push(s.t);
          const chSt = (st && st[slot.id]) || {};
          for (const series of slot.series) {
            const arr = d.series[series.key];
            const v = chSt[series.key];
            arr.push(typeof v === "number" ? v : 0);
          }
          d.pressed.push(!!chSt.pressed);
          d.pressCount.push(chSt.press_count || 0);
        }
      }
      trimBuffers();
      // CSV / no-camera fallback: there are no frame_tick messages, so the
      // ADC sample clock has to drive currentFrame.t. With a camera
      // attached the frame_tick handler does this instead.
      if (!paused && !hasCamera() && msg.samples.length) {
        const lastT = msg.samples[msg.samples.length - 1].t;
        setCurrentFrame(null, lastT);
      }
      if (!paused) updateCharts();
      if (actuateEnabled && msg.actuator_mask !== undefined) {
        document.querySelectorAll(".manual-btn").forEach(btn => {
          const bit = 1 << parseInt(btn.dataset.bit);
          if (msg.actuator_mask & bit) btn.classList.add("held");
          else btn.classList.remove("held");
        });
      }
    }

    else if (msg.type === "detector") {
      populateDetectorSelect(msg.available, msg.name);
      populateParamSliders(msg.params);
      populateTimingSliders(msg.timing);
      updateActuateButton(msg.actuate_enabled);
      if (msg.chart_schema) applySchema(msg.chart_schema);
    }

    else if (msg.type === "sources") {
      populateSourceSelect(msg.available, msg.active);
    }

    else if (msg.type === "actuator_status") {
      populateActuatorSelect(msg.available, msg);
    }

    else if (msg.type === "frame_tick") {
      // Master clock tick: every buffer write from the camera (~30 Hz).
      // Live mode advances currentFrame here so charts/overlays align to
      // the displayed frame. While paused we ignore ticks; the user is
      // holding currentFrame still via scrub controls.
      lastFrameTickAt = performance.now();
      if (!paused) {
        setCurrentFrame(msg.seq, msg.t);
        updateCharts();
      }
    }

    else if (msg.type === "serial_status") {
      const el = document.getElementById("status");
      if (msg.connected) {
        el.className = "connected";
        el.textContent = "Data port connected";
      } else {
        el.className = "serial-lost";
        el.textContent = "Data port \u2014 reconnecting\u2026";
      }
    }
  };
}

// Track which slider groups have been built so we can update in-place
let _paramKeys = [];
let _timingKeys = [];

function _buildSliderGroup(container, entries, idPrefix, msgType, storageSection, maxFn) {
  const existingKeys = Array.from(container.querySelectorAll("input[type=range]")).map(el => el.dataset.key);
  const newKeys = entries.map(([k]) => k);
  const needsRebuild = existingKeys.join(",") !== newKeys.join(",");

  if (needsRebuild) {
    container.innerHTML = "";
  }

  entries.forEach(([key, serverVal]) => {
    const id = idPrefix + key;
    const val = savedParam(key, serverVal);
    const maxVal = maxFn(val, serverVal);

    if (needsRebuild) {
      const label = document.createElement("label");
      label.textContent = key;

      const row = document.createElement("div");
      row.className = "slider-row";

      const range = document.createElement("input");
      range.type = "range";
      range.id = id;
      range.dataset.key = key;
      range.min = 0;
      range.max = maxVal;
      range.step = 1;
      range.value = val;

      const num = document.createElement("input");
      num.type = "number";
      num.id = id + "-num";
      num.min = 0;
      num.max = maxVal;
      num.value = val;

      function applyValue(v) {
        const clamped = Math.max(0, Math.min(parseInt(v) || 0, maxVal));
        range.value = clamped;
        num.value = clamped;
        const p = {};
        p[key] = clamped;
        const store = {};
        store[storageSection] = Object.assign({}, loadSettings()[storageSection] || {}, p);
        saveSettings(store);
        ws.send(JSON.stringify({ type: msgType, params: p }));
      }

      range.addEventListener("input", () => { num.value = range.value; });
      range.addEventListener("change", () => applyValue(range.value));
      num.addEventListener("change", () => applyValue(num.value));

      row.appendChild(range);
      row.appendChild(num);
      container.appendChild(label);
      container.appendChild(row);
    } else {
      const range = document.getElementById(id);
      const num = document.getElementById(id + "-num");
      if (range && document.activeElement !== range) {
        range.value = val;
      }
      if (num && document.activeElement !== num) {
        num.value = val;
      }
    }
  });
}

function populateParamSliders(params) {
  const container = document.getElementById("param-sliders");
  _buildSliderGroup(container, Object.entries(params), "param-", "set_params", "params",
    (val, serverVal) => Math.max(serverVal * 3, 4096));

// --- Scrub / slow-mo (active while paused) ---
const scrubControls = document.getElementById("scrub-controls");
const scrubInfo = document.getElementById("scrub-info");
const slowmoBtn = document.getElementById("btn-slowmo");
const slowmoSpeedSelect = document.getElementById("slowmo-speed");

let slowmoTimer = null;

function setSlowmoActive(active) {
  if (active) {
    slowmoBtn.classList.add("active");
    slowmoBtn.innerHTML = "&#10073;&#10073;"; // pause glyph
  } else {
    slowmoBtn.classList.remove("active");
    slowmoBtn.innerHTML = "&#9658;"; // play glyph
  }
}

function stopSlowmo() {
  if (slowmoTimer != null) {
    clearInterval(slowmoTimer);
    slowmoTimer = null;
  }
  setSlowmoActive(false);
}

function startSlowmo() {
  stopSlowmo();
  const speed = parseFloat(slowmoSpeedSelect.value) || 0.25;
  // One frame per (1/30 s) / speed of wallclock => playback at `speed` x real time.
  const intervalMs = Math.max(15, Math.round(1000 / 30 / speed));
  slowmoTimer = setInterval(async () => {
    const moved = await stepFrames(1);
    if (!moved) stopSlowmo();
  }, intervalMs);
  setSlowmoActive(true);
}

// In-flight guard. Slow-mo's setInterval doesn't wait for the previous
// async step to complete; without this, two ticks racing on the same
// starting seq would both step to (seq+1) and the second one would look
// like "no progress" and stop slow-mo. Skipping overlapping ticks just
// means slow-mo runs at the rate the network can sustain, which is what
// we want.
let _stepInFlight = false;

async function stepFrames(n) {
  if (_stepInFlight) return true;
  _stepInFlight = true;
  // Capture the seq we're stepping FROM. Edge detection compares against
  // this, not against currentFrame at completion time -- otherwise a
  // concurrent update could mask real progress as a stall.
  const fromSeq = currentFrame.seq;
  const fromT = currentFrame.t;
  try {
    const dir = n >= 0 ? "next" : "prev";
    const cnt = Math.abs(n);
    let url;
    if (fromSeq != null) {
      url = "/video/step?seq=" + encodeURIComponent(fromSeq)
          + "&dir=" + dir + "&n=" + cnt;
    } else {
      url = "/video/step?t=" + encodeURIComponent(fromT.toFixed(4))
          + "&dir=" + dir + "&n=" + cnt;
    }
    const resp = await fetch(url);
    if (!resp.ok) return false;
    const j = await resp.json();
    // Hit buffer edge: server returned the same frame we asked from.
    if (fromSeq != null && j.seq === fromSeq) return false;
    if (fromSeq == null && Math.abs(j.t - fromT) < 1e-6) return false;
    setCurrentFrame(j.seq, j.t);
    // Display the EXACT frame (by seq), then redraw chart/timeline
    // around currentFrame.t. No t-based snap involved -- the seq we just
    // got from /video/step is the seq we render.
    await scrubToCurrent();
    return true;
  } catch (e) {
    return false;
  } finally {
    _stepInFlight = false;
  }
}

function updateScrubInfo() {
  const speed = parseFloat(slowmoSpeedSelect.value) || 0.25;
  const seqStr = currentFrame.seq != null ? "  #" + currentFrame.seq : "";
  scrubInfo.textContent = "t = " + currentFrame.t.toFixed(3) + "s" + seqStr + "  @ " + speed + "x";
}

function getChartCenterTime() {
  const id = firstSlotId();
  if (!id) return 0;
  const d = data[id];
  if (!d || !d.t.length) return 0;

  const plot = plots[id];
  if (plot) {
    const scales = plot.scales;
    if (scales.x.min != null && scales.x.max != null) {
      return (scales.x.min + scales.x.max) / 2;
    }
  }
  return d.t[d.t.length - 1];
}

let _scrubReqId = 0;

// Shared core: fetch a snap (by seq or by t), display its JPEG, and
// return the authoritative {seq, t} the server actually rendered. Pure
// in the sense that it doesn't touch currentFrame or the chart -- the
// caller decides what to do with the returned ids.
async function _fetchAndDisplay(query) {
  if (!hasCamera()) return null;
  const myId = ++_scrubReqId;
  const url = "/video/snap?" + query;
  const resp = await fetch(url, { cache: "no-store" });
  if (myId !== _scrubReqId) return null;
  if (!resp.ok) return null;
  const seqHdr = resp.headers.get("X-Frame-Seq");
  const tHdr = resp.headers.get("X-Frame-Time");
  const seq = seqHdr != null ? parseInt(seqHdr, 10) : null;
  const ft = tHdr != null ? parseFloat(tHdr) : null;
  const blob = await resp.blob();
  if (myId !== _scrubReqId) return null;
  const oldUrl = mjpegImg._blobUrl;
  const blobUrl = URL.createObjectURL(blob);
  mjpegImg._blobUrl = blobUrl;
  mjpegImg.src = blobUrl;
  if (oldUrl) URL.revokeObjectURL(oldUrl);
  return { seq, t: ft };
}

function _setCamLabel(seq, t) {
  if (seq != null && t != null) {
    camTime.textContent = "t = " + t.toFixed(3) + "s  #" + seq;
  } else if (t != null) {
    camTime.textContent = "t = " + t.toFixed(3) + "s";
  }
}

// Display the exact buffered frame with this seq. Used whenever the UI
// already knows which frame it wants to show -- frame_step, slow-mo,
// and pause init all flow through here. NEVER snaps by time, so it can
// never silently drift to a neighbouring frame.
async function showFrameBySeq(seq) {
  if (seq == null) return false;
  const got = await _fetchAndDisplay("seq=" + encodeURIComponent(seq));
  if (!got) {
    camTime.textContent = "#" + seq + " (no frame)";
    return false;
  }
  _setCamLabel(got.seq, got.t);
  return true;
}

// Resolve an arbitrary time to the closest buffered frame, display it,
// and write the resolved {seq, t} into currentFrame. Used by drag/click
// inputs that don't have a seq (timeline drag, chart pan).
async function scrubToTime(t) {
  const got = await _fetchAndDisplay("t=" + encodeURIComponent(t.toFixed(4)));
  if (!got) {
    camTime.textContent = "t = " + t.toFixed(3) + "s (no frame)";
    return false;
  }
  setCurrentFrame(got.seq, got.t != null ? got.t : t);
  _setCamLabel(currentFrame.seq, currentFrame.t);
  renderAtTime(currentFrame.t, windowSec / 2);
  if (paused && !scrubControls.hidden) updateScrubInfo();
  return true;
}

// Display whatever frame currentFrame currently identifies, and refresh
// the chart/timeline around it. Used after stepFrames updates
// currentFrame from a /video/step response.
async function scrubToCurrent() {
  if (currentFrame.seq != null) {
    await showFrameBySeq(currentFrame.seq);
  } else if (hasCamera()) {
    // Lost our seq somehow; resolve via time as a fallback.
    await scrubToTime(currentFrame.t);
    return;
  } else {
    camTime.textContent = "t = " + currentFrame.t.toFixed(3) + "s (no video)";
  }
  renderAtTime(currentFrame.t, windowSec / 2);
  if (paused && !scrubControls.hidden) updateScrubInfo();
}

function showLiveVideo() {
  // Drop any pinned scrub blob so the next snap allocates a fresh one.
  if (mjpegImg._blobUrl) {
    URL.revokeObjectURL(mjpegImg._blobUrl);
    mjpegImg._blobUrl = null;
  }
  if (!hasCamera()) {
    mjpegImg.removeAttribute("src");
    camStatus.textContent = "No camera selected";
  } else {
    mjpegImg.src = "/video";
    camStatus.textContent = "Live";
  }
  camTime.textContent = "";
}

async function ensureAudio() {
  if (audioStream) return;
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
    audioEl.srcObject = audioStream;
  } catch (e) {
    console.warn("Could not start audio:", e.message);
  }
}

document.getElementById("btn-mute").addEventListener("click", async () => {
  audioMuted = !audioMuted;
  if (!audioMuted) await ensureAudio();
  audioEl.muted = audioMuted;
  const btn = document.getElementById("btn-mute");
  btn.textContent = audioMuted ? "Unmute" : "Mute";
  if (audioMuted) btn.classList.remove("active");
  else btn.classList.add("active");
});


// --- Manual buttons ---

let manualMask = 0;
let actuateEnabled = false;

function updateManualEnabled() {
  document.querySelectorAll(".manual-btn").forEach(btn => {
    btn.disabled = actuateEnabled;
  });
  if (actuateEnabled && manualMask !== 0) {
    manualMask = 0;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "manual_output", mask: 0 }));
    }
  }
}

function sendManualMask() {
  if (actuateEnabled) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "manual_output", mask: manualMask }));
  }
}

document.querySelectorAll(".manual-btn").forEach(btn => {
  const bit = 1 << parseInt(btn.dataset.bit);

  function press(e) {
    e.preventDefault();
    if (btn.disabled) return;
    btn.classList.add("held");
    manualMask |= bit;
    sendManualMask();
  }
  function release(e) {
    e.preventDefault();
    btn.classList.remove("held");
    manualMask &= ~bit;
    sendManualMask();
  }

  btn.addEventListener("mousedown", press);
  btn.addEventListener("mouseup", release);
  btn.addEventListener("mouseleave", release);
  btn.addEventListener("touchstart", press);
  btn.addEventListener("touchend", release);
  btn.addEventListener("touchcancel", release);
});

// --- Keyboard shortcuts ---
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;

  // Space: while paused, toggle slow-mo play/pause; otherwise toggle live pause.
  if (e.code === "Space") {
    e.preventDefault();
    if (paused) {
      if (slowmoTimer != null) stopSlowmo();
      else startSlowmo();
    } else {
      document.getElementById("btn-pause").click();
    }
    return;
  }

  if (!paused) return;

  if (e.key === "ArrowLeft") {
    e.preventDefault();
    stopSlowmo();
    stepFrames(e.shiftKey ? -10 : -1);
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    stopSlowmo();
    stepFrames(e.shiftKey ? 10 : 1);
  } else if (e.key === "=" || e.key === "+") {
    e.preventDefault();
    zoomAtScrub(1 / 1.3);
  } else if (e.key === "-" || e.key === "_") {
    e.preventDefault();
    zoomAtScrub(1.3);
  }
});

document.getElementById("charts").addEventListener("wheel", (e) => {
  if (!paused) return;
  e.preventDefault();
  zoomAtScrub(e.deltaY > 0 ? 1.3 : 1 / 1.3);
}, { passive: false });

// Boot
initCharts();
initTimeline();

connect();
</script>

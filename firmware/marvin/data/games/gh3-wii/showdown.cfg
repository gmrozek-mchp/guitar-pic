# SHOWDOWN — the 2-player match the dashboard's SHOWDOWN button starts.
#
#   song       = <main|bonus>,<index>    index as in songs.csv
#   difficulty = easy | medium | hard | expert
#
# Both keys are required. If either is missing or unusable — or the song isn't one
# marvin can navigate to — the SHOWDOWN button is not shown at all, and the reason is
# logged. Edits take effect on the next tap; no reboot, no reflash.

song       = main,4
difficulty = hard

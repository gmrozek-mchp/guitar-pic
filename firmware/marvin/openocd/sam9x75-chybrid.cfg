# SAM9X75 Curiosity Hybrid — JTAG debug via onboard FT4232H channel A.
#
# Channel A is the JTAG port; channel C is the DBGU serial console.
# Channel A pinout: TCK=AD0, TDI=AD1, TDO=AD2, TMS=AD3, nRST=AD5, RTCK=AD7.
# AD4/AD6 are N/C — there is no nTRST on this board.
# Apple's FTDI serial driver still binds all four channels as /dev/cu.usbserial-*;
# libusb claims channel A for MPSSE regardless, so no driver change is needed.
#
# Usage:
#   openocd -f firmware/marvin/openocd/sam9x75-chybrid.cfg
# then in another terminal: arm-none-eabi-gdb, target remote :3333

adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 0
ftdi layout_init 0x0008 0x000b
ftdi layout_signal nSRST -oe 0x0020

# Select a specific board by its FT4232H serial when several are connected:
#   openocd -c "set FTDI_SERIAL W16-2026-359" -f sam9x75-chybrid.cfg
# Leave FTDI_SERIAL unset to use the first matching FT4232H.
if { [info exists FTDI_SERIAL] } {
    adapter serial $FTDI_SERIAL
}

transport select jtag
adapter speed 1000
# RTCK is wired (AD7), so adaptive clocking is available via: adapter speed 0

set _CHIPNAME sam9x75
set _CPUTAPID 0x0792603f

# nRST (AD5) is the SAM9's open-drain system reset; no nTRST on this board.
# srst_nogate keeps the JTAG TAP alive across reset so `reset halt`/`reset init`
# can catch the core immediately after reset is released.
reset_config srst_only srst_open_drain srst_nogate
adapter srst delay 300

jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME arm926ejs -endian little -chain-position $_TARGETNAME

# This board boots from ROM/at91bootstrap immediately after reset, at high speed,
# so a single post-reset halt is racy. Slow the clock during reset and retry the
# halt until the core is caught, then restore full speed. Makes `reset halt` /
# `reset init` reliable on this auto-booting board.
$_TARGETNAME configure -event reset-start {
    adapter speed 100
}
$_TARGETNAME configure -event reset-deassert-post {
    for {set i 0} {$i < 100} {incr i} {
        if {[catch {halt 20}] == 0} break
        sleep 5
    }
    adapter speed 1000
}

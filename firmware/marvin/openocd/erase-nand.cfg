# Load u-boot over JTAG so its atmel_nand driver can erase NAND — used to make
# the board non-bootable and return to RAM development without touching the
# JP3/JP4 jumpers. See erase-nand.sh and program-nand.md.
#
# Unlike load-ram (which assumes no bootable medium, so the core is caught in the
# ROM monitor with the MMU off), this runs against a board that IS booting from NAND
# — either marvin, or a valid boot-region at91bootstrap looping on a corrupt app.
# We therefore can't rely on `reset init` catching a clean state. So: halt, force a
# known state (MMU/caches off, IRQs masked, WDT off), then probe DDR. Whatever booted
# from NAND already brought up clocks + DDR3L, so if the probe round-trips we load
# u-boot straight into that DDR. Only a genuinely cold controller (erased NAND → ROM
# monitor) runs the init-and-stop bootstrap. Never init DDR twice: re-running the
# bootstrap's DDR3L init on a live MPDDRC mistrains it (reads shift by a halfword).

proc load_uboot {bootstrap_elf boot_entry uboot_bin} {
    # reset init recovers from any state (incl. a board wedged by a prior failed
    # attempt) and disables the watchdog. NAND boots before the post-reset halt
    # lands, so the core is caught mid-marvin with MMU + caches ON.
    reset init

    # Force MMU + I/D caches off so DDR + peripherals are physically addressable,
    # invalidate caches + TLBs, and mask IRQ/FIQ (SVC mode). Without this, the
    # bootstrap/u-boot load lands under marvin's virtual mapping and aborts.
    set sctlr [arm mrc 15 0 1 0 0]
    arm mcr 15 0 1 0 0 [expr {$sctlr & ~0x1005}]   ;# clear M(0), C(2), I(12)
    arm mcr 15 0 7 5 0 0     ;# invalidate I-cache
    arm mcr 15 0 7 6 0 0     ;# invalidate D-cache
    arm mcr 15 0 8 7 0 0     ;# invalidate TLBs
    reg cpsr 0x000000d3

    # DDR up? Probe it directly rather than inferring from the PC. DDR is already
    # usable at catch time in every case except a genuinely cold controller: marvin
    # running from NAND, OR a valid boot-region at91bootstrap that brought DDR up and
    # is now looping on a corrupt app (JP3 in) — that bootstrap is caught in SRAM, so
    # a PC test would wrongly call it "cold". Only an erased NAND (ROM/SAM-BA monitor)
    # leaves DDR cold and needs bootstrap-none. Re-running bootstrap-none's DDR3L init
    # on an already-initialized MPDDRC mistrains it (reads come back shifted by a
    # halfword), so we must never init DDR twice. The u-boot load below overwrites
    # 0x23f00000, so clobbering it with the probe pattern is harmless.
    set ddr_ok 0
    catch {
        write_memory 0x23f00000 32 {0xdeadbeef 0x12345678}
        set rb [read_memory 0x23f00000 32 2]
        if {[lindex $rb 0] == 0xdeadbeef && [lindex $rb 1] == 0x12345678} { set ddr_ok 1 }
    }
    if {$ddr_ok} {
        echo ">>> DDR already initialized (probe ok) — loading u-boot directly"
    } else {
        echo ">>> DDR cold — running init-and-stop bootstrap first"
        # Adaptive clocking (RTCK) is mandatory while the bootstrap runs: at a fixed
        # TCK, OpenOCD loses JTAG sync when lowlevel_clock_init switches the master
        # clock and wait_halt catches a garbage state (see load-ram.cfg). Enter in
        # ARM/Supervisor with IRQ+FIQ masked, the reset state the bootstrap expects.
        adapter speed 0
        reg cpsr 0x000000d3
        load_image $bootstrap_elf
        arm mcr 15 0 7 5 0 0
        resume $boot_entry
        wait_halt 6000
        echo ">>> at91bootstrap init complete: clocks + DDR up"
    }

    adapter speed 6000
    arm7_9 dcc_downloads enable
    load_image $uboot_bin 0x23f00000 bin
    arm mcr 15 0 7 5 0 0

    echo ">>> starting u-boot — JTAG done; erasing NAND from the console"
    resume 0x23f00000
}

# FT4232H EEPROM image for the SAM9X75 cHybrid REV1 (U8 FT4232H + U9 93LC46B).
#
# Channel A is hardwired to the onboard JTAG (MPSSE) bus, so it is set D2XX-only
# (cha_vcp=false): it should NOT enumerate as a serial port, leaving it cleanly
# available to OpenOCD/libusb. Channel C is the DBGU console (populated via
# R149/R151, sch sheet 14) and stays VCP. Channels B and D are unconnected on
# this design (B's resistors are DNP), so they are also D2XX to suppress their
# phantom serial ports. Net result: a single /dev/cu node, the DBGU on channel C.

vendor_id=0x0403
product_id=0x6011

manufacturer="Microchip"
product="SAM9X75 cHybrid"
use_serial=true
serial="W16-2026-359"

self_powered=false
max_power=500

# Driver per channel: false = D2XX (no /dev/cu node), true = VCP (serial port).
cha_vcp=false
chb_vcp=false
chc_vcp=true
chd_vcp=false

# A/B are MPSSE-capable; keep plain UART signaling. MPSSE/JTAG is engaged by the
# host at runtime regardless of this field.
cha_type=UART
chb_type=UART

filename="ft4232h-chybrid-rev1.bin"
